<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid lesson</title>
</head>
<body>
    <div style="display: grid;
    grid-template-columns: 100px 100px;">
        <div style="background-color: pink">div 1</div>
        <div style="background-color: cyan">div 2
        <p> new text</p></div>
    </div>

    <div style="display: grid;
    grid-template-columns: 100px 100px 200px;
    margin-top: 5px;">
        <div style="background-color: pink">div 1</div>
        <div style="background-color: cyan">div 2
        <p> new text</p></div>
        <div style="background-color: yellow">div 3</div>
        <div style="background-color: magenta">div 4 (jika div melebihi coloumn yang sudah di tetapkan, maka div grid selanjutnya akan diulang pada grid yang pertama dibawah yang ada</div>

    </div>

    <div style="display: grid;
    grid-template-columns: 100px 1fr;
    margin-top: 10px;">
        <div style="background-color: pink">div 1</div>
        <div style="background-color: cyan">div 2
        <p> new text</p></div>
    </div>

    <div style="display: grid;
    grid-template-columns: 100px 1fr 1fr;
    margin-top: 10px;">
        <div style="background-color: pink">div 1</div>
        <div style="background-color: cyan">div 2
        <p> new text</p></div>
        <div style="background-color: yellow">div 3</div>

    </div>
</body>
</html>
